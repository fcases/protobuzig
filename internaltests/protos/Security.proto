syntax = "proto2";
package k6bus.security;
option optimize_for = SPEED;

// ---------------------------------------------------------------------
// Subtenataj algoritmoj
// ---------------------------------------------------------------------
// 2026-09-01: AES-256-CBC estis forlasita (maleebla sen MAC kaj sen subteno
// en std.crypto de Zig); la pozicio 3 restas rezervita. CRYPTO_CUSTOM
// permesas enmeti propran kompilitan realigon (sama konvencio kiel
// TransportKind.CUSTOM = 100), sen dlopen por nun.
// ---------------------------------------------------------------------
enum CryptoMode {
    CRYPTO_NONE              = 0;
    CRYPTO_AES_256_GCM       = 1;
    CRYPTO_CHACHA20_POLY1305 = 2;
    // 3: rezervita (AES-256-CBC forlasita)
    CRYPTO_CUSTOM            = 100;
}

// ---------------------------------------------------------------------
// Sxlosila registro
// ---------------------------------------------------------------------
// version: formatokontrakto (nedeviga; sen komerca kongrueco).
// mode: REQUIRED - eksplicite, kiu cxifro uzigxis (skribas la generilo).
// key_id: REQUIRED - identigas la sxlosilon (estonta rotacio).
// key: REQUIRED - cxiam en Base64-teksto.
// iv: forigita - GCM/ChaCha uzas hazardan nonce po mesagxo.
//
// Vivociklo (2026-09-07):
// - Cxiu sxlosilo naskigxas kun valida fenestro [created_on, expires_on].
// - created_on: REQUIRED - komenco de valideco, ISO 8601 UTC
//   (ekz. 2026-09-07T18:00:00Z). La sxlosilo NE validas antaux tiu momento.
// - expires_on: REQUIRED - fino de valideco, ISO 8601 UTC. La sxlosilo NE
//   validas ekde tiu momento. OBLIGATORIA: rotacio planigxas generante.
// - Limigoj: expires_on > created_on; ambaux en UTC. ISO 8601 en string:
//   legebla en la dosiero kaj leksikografia ordo = kronologia ordo.
// - La kontrolo EN PROGRESO (rifuzi eksvalidajn sxlosilojn cxe sxargo kaj
//   averti proksime de eksvalidigxo) realigxos en LoadCipher kiam estos la
//   sxlosila administrilo. Sen permana revokado (status/revoked_on) por nun:
//   la eksvalidigxo estas la automata malvalidigo.
// ---------------------------------------------------------------------

message KeyRecord {
    optional uint32 version = 1 	[default = 1];
    optional string description = 2;
    required CryptoMode mode = 3;
    required uint32 key_id = 4;

    // Cxiam konservata en Base64-teksto.
    required string key = 5;

    // Valida fenestro (ISO 8601 UTC).
    required string created_on = 6;
    required string expires_on = 7;
}

// ---------------------------------------------------------------------
// Registro de sxlosiloj (2026-09-10)
// ---------------------------------------------------------------------
// Unu sola registra dosiero (nun formato ZON, ekz.
// sec/k6bus.lab.zon.keyreg) enhavas N KeyRecord. La domajno elektas kiun uzi
// per DomainConfig.key_registry_file + key_id.
// version kaj description estas DEVENDAJ en la registro (en KeyRecord ili
// restas nedevigaj): la registro deklaras sian formatokontrakton kaj por
// kiu medio gxi estas (lab / prod / ...).
// Sen kongrueco kun antauxaj versioj (ni plu restas en v1).
// ---------------------------------------------------------------------

message KeyRegistry {
    required uint32 version = 1;
    required string description = 2;
    repeated KeyRecord keys = 3;
}
