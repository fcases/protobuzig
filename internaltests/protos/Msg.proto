syntax = "proto2";

package k6bus.msg;

option optimize_for = SPEED;

///////////////////////////////////////////////////////////
// Baza mesagxo de la buso
///////////////////////////////////////////////////////////

message Msg {
    repeated fixed32 channels = 1;   // difinitaj en kodo (compile-time)
    required fixed64 msgType  = 2;
    required bytes payLoad    = 3;
}
